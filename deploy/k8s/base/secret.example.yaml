# EXAMPLE ONLY. Not referenced by any kustomization and must never hold real values in git.
#
# Create the real Secret out of band (or with External Secrets / Sealed Secrets / SOPS):
#
#   kubectl create namespace promptlab   # if it does not exist yet
#   kubectl -n promptlab create secret generic promptlab-secrets \
#     --from-literal=PROMPTLAB_DATABASE_URL='postgresql+asyncpg://USER:PASSWORD@HOST:5432/promptlab' \
#     --from-literal=PROMPTLAB_BOOTSTRAP_ADMIN_KEY="$(openssl rand -hex 32)"
#
# PROMPTLAB_DATABASE_URL        required  SQLAlchemy async URL (postgresql+asyncpg://...).
# PROMPTLAB_BOOTSTRAP_ADMIN_KEY optional  Break-glass admin key; use it to create real API keys,
#                                         then remove it from the Secret and restart the pods.
apiVersion: v1
kind: Secret
metadata:
  name: promptlab-secrets
  namespace: promptlab
type: Opaque
stringData:
  PROMPTLAB_DATABASE_URL: postgresql+asyncpg://promptlab:CHANGE_ME@postgres.example.internal:5432/promptlab
  PROMPTLAB_BOOTSTRAP_ADMIN_KEY: CHANGE_ME

# Non-secret runtime settings (see docs/deployment.md for every PROMPTLAB_* variable).
# Secrets (database URL, bootstrap admin key) come from the `promptlab-secrets` Secret.
# Pods read these at start-up: run `kubectl -n promptlab rollout restart deployment/promptlab`
# after changing them outside of a deploy.
apiVersion: v1
kind: ConfigMap
metadata:
  name: promptlab-config
data:
  PROMPTLAB_ENVIRONMENT: production
  PROMPTLAB_LOG_LEVEL: INFO
  PROMPTLAB_LOG_JSON: "true"
  PROMPTLAB_METRICS_ENABLED: "true"
  PROMPTLAB_AUTH_ENABLED: "true"
  # Per worker process: connections = pool_size + max_overflow.
  # Budget: max replicas x WEB_CONCURRENCY x (pool_size + max_overflow) <= Postgres max_connections.
  PROMPTLAB_DB_POOL_SIZE: "5"
  PROMPTLAB_DB_MAX_OVERFLOW: "5"
  PROMPTLAB_DB_POOL_RECYCLE_SECONDS: "1800"
  PROMPTLAB_RESOLVE_CACHE_TTL_SECONDS: "2"
  PROMPTLAB_RESOLVE_CACHE_MAX_ENTRIES: "10000"
  # Comma-separated browser origins allowed by CORS; empty disables CORS.
  PROMPTLAB_CORS_ORIGINS: ""

apiVersion: apps/v1
kind: Deployment
metadata:
  name: promptlab
spec:
  template:
    spec:
      containers:
        - name: promptlab
          env:
            - name: WEB_CONCURRENCY
              value: "1"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

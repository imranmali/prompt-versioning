apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production overlay. CD pins the image to the published digest before applying:
#   kustomize edit set image ghcr.io/imranmali/prompt-versioning=ghcr.io/<owner>/<repo>@sha256:...

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/environment: production

images:
  - name: ghcr.io/imranmali/prompt-versioning
    newTag: latest

patches:
  - path: deployment-patch.yaml
  - path: hpa-patch.yaml
  - path: configmap-patch.yaml

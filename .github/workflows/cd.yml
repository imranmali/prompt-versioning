name: CD

# main  -> image tagged sha-<short> and latest
# vX.Y.Z -> image tagged X.Y.Z and X.Y, plus a GitHub Release with generated notes
# Optional deploy to Kubernetes when the repository variable DEPLOY_ENABLED is 'true'
# (requires the KUBE_CONFIG secret on the protected `production` environment).

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build & publish image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # create GitHub Releases on tags
      packages: write # push to ghcr.io
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image name
        id: image
        # Registry paths must be lowercase; the same name metadata-action produces.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=PromptLab
            org.opencontainers.image.licenses=MIT

      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=promptlab
          cache-to: type=gha,scope=promptlab,mode=max
          provenance: mode=max
          sbom: true

      - name: Summary
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published image"
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
            echo
            echo "Tags:"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            Container image: `${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}`
            (`${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}`)

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for details.

  deploy:
    name: Deploy to production
    needs: publish
    # Opt-in per repository; never deploy builds of arbitrary branches.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      NAMESPACE: promptlab
      BASE_IMAGE: ghcr.io/imranmali/prompt-versioning # image name used in deploy/k8s
      IMAGE_REF: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
      KUSTOMIZE_VERSION: 5.4.3
      KUSTOMIZE_SHA256: 3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-kubectl@v5
        with:
          version: v1.31.4

      - name: Install kustomize
        run: |
          archive="$RUNNER_TEMP/kustomize.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" kustomize
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Configure cluster access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG" ]; then
            echo "::error::DEPLOY_ENABLED is true but the KUBE_CONFIG secret is not set on the production environment."
            exit 1
          fi
          umask 077
          kubeconfig="$RUNNER_TEMP/kubeconfig"
          # Accept the kubeconfig either as plain YAML or base64-encoded.
          if printf '%s' "$KUBE_CONFIG" | base64 --decode > "$kubeconfig" 2>/dev/null \
            && grep -q '^apiVersion:' "$kubeconfig"; then
            :
          else
            printf '%s\n' "$KUBE_CONFIG" > "$kubeconfig"
          fi
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"

      - name: Pin image digest in manifests
        run: |
          for dir in deploy/k8s/overlays/production deploy/k8s/jobs; do
            (cd "$dir" && kustomize edit set image "${BASE_IMAGE}=${IMAGE_REF}")
          done
          kubectl kustomize deploy/k8s/overlays/production | grep -n 'image:'

      - name: Run database migrations
        run: |
          kubectl -n "$NAMESPACE" delete job promptlab-migrate --ignore-not-found --wait=true
          kubectl apply -k deploy/k8s/jobs
          for _ in $(seq 1 120); do
            succeeded=$(kubectl -n "$NAMESPACE" get job promptlab-migrate -o jsonpath='{.status.succeeded}')
            failed=$(kubectl -n "$NAMESPACE" get job promptlab-migrate \
              -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}')
            if [ "${succeeded:-0}" -ge 1 ]; then
              kubectl -n "$NAMESPACE" logs job/promptlab-migrate --tail=100 || true
              echo "Migrations completed."
              exit 0
            fi
            if [ "$failed" = "True" ]; then
              echo "::error::Migration job failed; the Deployment was not updated."
              kubectl -n "$NAMESPACE" describe job promptlab-migrate || true
              kubectl -n "$NAMESPACE" logs job/promptlab-migrate --tail=200 || true
              exit 1
            fi
            sleep 5
          done
          echo "::error::Timed out waiting for the migration job."
          kubectl -n "$NAMESPACE" describe job promptlab-migrate || true
          exit 1

      - name: Roll out the API
        run: |
          kubectl apply -k deploy/k8s/overlays/production
          if ! kubectl -n "$NAMESPACE" rollout status deployment/promptlab --timeout=300s; then
            echo "::error::Rollout did not complete. Roll back with: kubectl -n $NAMESPACE rollout undo deployment/promptlab"
            kubectl -n "$NAMESPACE" get pods -o wide || true
            kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -n 30 || true
            exit 1
          fi
          {
            echo "### Deployed"
            echo
            echo "\`${IMAGE_REF}\` to namespace \`${NAMESPACE}\`"
          } >> "$GITHUB_STEP_SUMMARY"

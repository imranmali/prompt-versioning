name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; every push to main is verified to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  UV_FROZEN: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy

  test:
    name: Tests (Python ${{ matrix.python-version }}, SQLite)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}
      - name: Run tests with coverage
        run: uv run --python ${{ matrix.python-version }} pytest --cov --cov-report=xml --cov-report=term
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  test-postgres:
    name: Tests (PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: promptlab
          POSTGRES_PASSWORD: promptlab
          POSTGRES_DB: promptlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promptlab -d promptlab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PROMPTLAB_TEST_DATABASE_URL: postgresql+asyncpg://promptlab:promptlab@localhost:5432/promptlab_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests against PostgreSQL
        run: uv run pytest --cov --cov-report=term

  migrations:
    name: Migrations up/down (PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: promptlab
          POSTGRES_PASSWORD: promptlab
          POSTGRES_DB: promptlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promptlab -d promptlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PROMPTLAB_DATABASE_URL: postgresql+asyncpg://promptlab:promptlab@localhost:5432/promptlab
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Upgrade to head
        run: uv run promptlab migrate
      - name: Models match migrations
        run: uv run alembic check
      - name: Downgrade to base
        run: uv run promptlab downgrade base
      - name: Upgrade to head again
        run: uv run promptlab migrate

  openspec:
    name: OpenSpec validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OPENSPEC_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate specs and changes
        run: npx --yes @fission-ai/openspec@1.14.3 validate --all --strict

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SMOKE_ADMIN_KEY: ci-smoke-admin-key
      SMOKE_DB_URL: sqlite+aiosqlite:////tmp/promptlab.db
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: promptlab:ci
          cache-from: type=gha,scope=promptlab
          cache-to: type=gha,scope=promptlab,mode=max
      - name: Run migrations in the image
        # The named volume is seeded from the image's /tmp (mode 1777), so UID 10001 can write.
        run: |
          docker volume create promptlab-smoke
          docker run --rm -v promptlab-smoke:/tmp \
            -e PROMPTLAB_DATABASE_URL="$SMOKE_DB_URL" promptlab:ci migrate
      - name: Start the API
        run: |
          docker run -d --name promptlab-smoke -p 8000:8000 -v promptlab-smoke:/tmp \
            -e PROMPTLAB_DATABASE_URL="$SMOKE_DB_URL" \
            -e PROMPTLAB_BOOTSTRAP_ADMIN_KEY="$SMOKE_ADMIN_KEY" \
            promptlab:ci serve --host 0.0.0.0 --port 8000 --workers 2
      - name: Smoke test endpoints
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz; then echo; break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          echo
          curl -fsS http://127.0.0.1:8000/readyz
          echo
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "X-API-Key: $SMOKE_ADMIN_KEY" http://127.0.0.1:8000/v1/api-keys)
          echo "GET /v1/api-keys -> $status"
          test "$status" = "200"
          test "$(docker inspect -f '{{.Config.User}}' promptlab:ci)" = "10001:10001"
      - name: Container logs
        if: failure()
        run: docker logs promptlab-smoke || true
      - name: Clean up
        if: always()
        run: |
          docker rm -f promptlab-smoke || true
          docker volume rm promptlab-smoke || true

  ci-success:
    name: ci-success
    # Single required status check for branch protection on main.
    if: always()
    needs: [lint, test, test-postgres, migrations, openspec, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify all jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null

[project]
name = "promptlab"
version = "1.0.0"
description = "Prompt versioning and A/B testing platform for LLM applications"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "imranmali" }]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: FastAPI",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn[standard]>=0.54.0",
  "sqlalchemy[asyncio]>=2.1.6",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.20.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "jinja2>=3.1.4",
  "prometheus-client>=0.20",
]

[project.scripts]
promptlab = "promptlab.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.17.2",
  "mypy>=1.10",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promptlab"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT", "C4"]
ignore = ["B008"]  # FastAPI dependency injection uses calls in defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["promptlab"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["promptlab.migrations.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:promptlab.*"]

[tool.coverage.run]
source = ["promptlab"]
branch = true
concurrency = ["greenlet", "thread"]
omit = ["src/promptlab/migrations/*", "src/promptlab/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@overload"]
